<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Conversation Exchange | Cambridge Language Centre</title>
	<meta name="description" content="Free one-to-one language exchange partnerships arranged by the University of Cambridge Language Centre.">
	<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
	<link rel="preload" href="./fonts/OpenSans-Regular.woff2" as="font"
		type="font/woff2" crossorigin>
	<link rel="preload" href="./fonts/Feijoa-Bold.woff2" as="font"
		type="font/woff2" crossorigin>
	<script type="module" src="./src/scripts/main.js"></script>
</head>

<body class="flex min-h-screen flex-col theme-exchange">

	<lc-header page-label="Conversation Exchange — site header"></lc-header>

	<main id="main-content" class="grow">
		<section class="mx-auto grid w-full max-w-6xl gap-8 px-4 py-8 md:py-12 lg:grid-cols-2 lg:items-stretch">

			<lc-hero-poster artwork-src="./assets/illustrations/hello-bonjour-signs.svg" artwork-alt=""></lc-hero-poster>

			<lc-info-card heading="Conversation Exchange" lede="Practice your speaking skills and help others learn your native language.">
				<p>We can match you with native speakers who would love to exchange languages with you. You and your language partner decide when, how often and where you meet.</p>
				<p>Free, one-to-one sessions available throughout the year.</p>
				<div class="flex flex-wrap items-center justify-between gap-4">
					<a class="inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-base/(--leading-body) font-bold !text-white !no-underline transition hover:bg-accent-strong hover:-translate-y-0.5" href="https://www.langcen.cam.ac.uk/advising/speaking-practice.html">Book your place online</a>
					<img src="./assets/illustrations/mug-conversation.svg" alt="" aria-hidden="true"
						class="w-20 shrink-0 md:w-24">
				</div>
			</lc-info-card>

		</section>
	</main>

	<lc-footer></lc-footer>

	<script src="https://cc.cdn.civiccomputing.com/9/cookieControl-9.x.min.js"></script>
	<script type="module" src="./src/scripts/cookies.js"></script>
</body>

</html>
