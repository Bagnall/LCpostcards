<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Study Abroad | Cambridge Language Centre</title>
	<meta name="description" content="Short intensive language courses abroad, arranged through the University of Cambridge Language Centre.">
	<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
	<link rel="preload" href="./fonts/OpenSans-Regular.woff2" as="font"
		type="font/woff2" crossorigin>
	<link rel="preload" href="./fonts/Feijoa-Bold.woff2" as="font"
		type="font/woff2" crossorigin>
	<script type="module" src="./src/scripts/main.js"></script>
</head>

<body class="flex min-h-screen flex-col theme-abroad">

	<lc-header page-label="Study Abroad — site header"></lc-header>

	<main id="main-content" class="grow">
		<section class="mx-auto grid w-full max-w-6xl gap-8 px-4 py-8 md:py-12 lg:grid-cols-[3fr_2fr] lg:items-start lg:gap-12">

			<lc-hero-poster heading="Study Abroad"
				artwork-src="./assets/illustrations/studying-abroad.svg" artwork-alt=""></lc-hero-poster>

			<lc-info-card lede="Choose a short language course.">
				<p>Intensive study abroad gives you the ideal opportunity to immerse yourself in a language, as well as the chance to travel and experience a new country and its culture.</p>
				<p><strong>Explore your options by booking a study abroad appointment and consulting our Moodle site.</strong></p>
				<div class="flex flex-wrap items-center justify-between gap-4">
					<a class="inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-base/(--leading-body) font-bold !text-white !no-underline transition hover:bg-accent-strong hover:-translate-y-0.5" href="https://www.vle.cam.ac.uk/course/view.php?id=67022">Open the Study Abroad Moodle site</a>
				</div>
			</lc-info-card>

		</section>
	</main>

	<lc-footer></lc-footer>

	<script src="https://cc.cdn.civiccomputing.com/9/cookieControl-9.x.min.js"></script>
	<script type="module" src="./src/scripts/cookies.js"></script>
</body>

</html>
