<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Study Abroad</title>
	<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
	<script type="module" src="./src/scripts/main.js"></script>
</head>

<body class="min-h-screen bg-page text-main theme-intermediate">
	<div class="min-h-screen flex flex-col">

		<lc-header page-label="Study Abroad site header"></lc-header>

		<main id="main-content" aria-label="Study Abroad content">

			<section class="py-8 md:py-10">
				<div class="max-w-6xl mx-auto w-full px-4 grid gap-8 items-stretch lg:grid-cols-[var(--cols-hero)]">

					<lc-hero-poster artwork-src="./assets/globe.svg" artwork-alt="" artwork-class="advising-globe-image w-auto h-full"></lc-hero-poster>

					<lc-info-card
						heading="Study Abroad"
						subheading="Choose a short language course">

			<p class="text-soft mt-4 text-base md:text-lg leading-7">Intensive study
			abroad gives you the ideal opportunity to immerse yourself in a language, as well as the
			chance to travel and experience a new country and its culture.</p>
			<p class="text-soft mt-4 text-base md:text-lg leading-7">
			<strong>Explore your options by booking a study abroad appointment:</strong> <a
			class="font-semibold underline underline-offset-2"
			href="https://www.langcen.cam.ac.uk/advising/study-abroad.html">langcen.cam.ac.uk/advising/study-abroad.html</a>
			</p>

					</lc-info-card>

				</div>
			</section>

		</main>

		<lc-footer></lc-footer>

	</div>
	<script src="https://cc.cdn.civiccomputing.com/9/cookieControl-9.x.min.js"></script>
	<script src="./src/scripts/cookies.js"></script>
</body>

</html>
