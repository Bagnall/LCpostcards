<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Friends Without Frontiers | Cambridge Language Centre</title>
	<meta name="description" content="Free one-to-one conversation sessions with native speaker volunteers, offered termly at the University of Cambridge Language Centre.">
	<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
	<link rel="preload" href="./fonts/OpenSans-Regular.woff2" as="font"
		type="font/woff2" crossorigin>
	<link rel="preload" href="./fonts/Feijoa-Bold.woff2" as="font"
		type="font/woff2" crossorigin>
	<script type="module" src="./src/scripts/main.js"></script>
</head>

<body class="flex min-h-screen flex-col theme-friends">

	<lc-header page-label="Friends Without Frontiers — site header"></lc-header>

	<main id="main-content" class="grow">
		<section class="mx-auto grid w-full max-w-6xl gap-8 px-4 py-8 md:py-12 lg:grid-cols-[3fr_2fr] lg:items-start lg:gap-12">

			<lc-hero-poster heading="Friends Without Frontiers"
				artwork-src="./assets/illustrations/conversation-at-table.svg" artwork-alt=""></lc-hero-poster>

			<lc-info-card lede="Practice your speaking skills.">
				<p>Free, one-to-one, 20- or 30-minute sessions with native speaker volunteers. Meetings could take place online, or at the Language Centre.</p>
				<p>Offered termly in a range of languages.</p>
				<div class="flex flex-wrap items-center justify-between gap-4">
					<a class="inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-base/(--leading-body) font-bold !text-white !no-underline transition hover:bg-accent-strong hover:-translate-y-0.5" href="https://www.langcen.cam.ac.uk/advising/speaking-practice.html">Book your place online</a>
					<img src="./assets/illustrations/globe.webp" alt="" aria-hidden="true"
						class="w-20 shrink-0 md:w-24">
				</div>
			</lc-info-card>

		</section>
	</main>

	<lc-footer></lc-footer>

	<script src="https://cc.cdn.civiccomputing.com/9/cookieControl-9.x.min.js"></script>
	<script type="module" src="./src/scripts/cookies.js"></script>
</body>

</html>
