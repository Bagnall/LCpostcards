<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Language Advising | Cambridge Language Centre</title>
	<meta name="description" content="Book a free 30-minute one-to-one language advising appointment at the University of Cambridge Language Centre.">
	<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
	<script type="module" src="./src/scripts/main.js"></script>
</head>

<body class="flex min-h-screen flex-col theme-advising">

	<lc-header page-label="Language Advising — site header"></lc-header>

	<main id="main-content" class="grow">
		<section class="mx-auto grid w-full max-w-6xl gap-8 px-4 py-8 md:py-12 lg:grid-cols-2 lg:items-stretch">

			<lc-hero-poster artwork-src="./assets/illustrations/language-advising.svg" artwork-alt=""></lc-hero-poster>

			<lc-info-card heading="Language Advising" lede="Book a free, 30-minute, one-to-one appointment to:">
				<ul><li>Evaluate your progress</li><li>Decide on your learning goals</li><li>Discuss strategies for independent studies and formulate a plan</li></ul>
				<p>Appointments are available virtually or in person.</p>
				<div class="flex flex-wrap items-center justify-between gap-4">
					<a class="inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-base font-bold !text-white !no-underline transition hover:bg-accent-strong hover:-translate-y-0.5" href="mailto:enquiries@langcen.cam.ac.uk">Email us to book your appointment</a>
				</div>
			</lc-info-card>

		</section>
	</main>

	<lc-footer></lc-footer>

	<script src="https://cc.cdn.civiccomputing.com/9/cookieControl-9.x.min.js"></script>
	<script type="module" src="./src/scripts/cookies.js"></script>
</body>

</html>
