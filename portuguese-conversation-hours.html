<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Portuguese Intermediate and Advanced Conversation Hours | Cambridge Language Centre</title>
	<meta name="description" content="Informal Portuguese conversation groups for B1+ and C1+ learners at the University of Cambridge Language Centre.">
	<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
	<link rel="preload" href="./fonts/OpenSans-Regular.woff2" as="font"
		type="font/woff2" crossorigin>
	<link rel="preload" href="./fonts/Feijoa-Bold.woff2" as="font"
		type="font/woff2" crossorigin>
	<script type="module" src="./src/scripts/main.js"></script>
</head>

<body class="flex min-h-screen flex-col theme-portuguese">

	<lc-header page-label="Portuguese Intermediate and Advanced Conversation Hours — site header"></lc-header>

	<main id="main-content" class="grow">
		<section class="mx-auto grid w-full max-w-6xl gap-8 px-4 py-8 md:py-12 lg:grid-cols-2 lg:items-stretch">

			<lc-hero-poster artwork-src="./assets/illustrations/portuguese-conversation.svg" artwork-alt=""></lc-hero-poster>

			<lc-info-card heading="Portuguese Intermediate and Advanced Conversation Hours" lede="Develop your language speaking skills.">
				<p>Informal group sessions, with topics chosen by the participants and supported by a language teacher.</p>
				<ul><li>Intermediate: suitable for B1+ learners</li><li>Advanced: suitable for C1+ learners</li></ul>
				<lc-fees></lc-fees>
				<div class="flex flex-wrap items-center justify-between gap-4">
					<a class="inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-base/(--leading-body) font-bold !text-white !no-underline transition hover:bg-accent-strong hover:-translate-y-0.5" href="https://www.langcen.cam.ac.uk/advising/speaking-practice.html">Book your place online</a>
					<img src="./assets/illustrations/language-levels.svg" alt="" aria-hidden="true"
						class="w-20 shrink-0 md:w-24">
				</div>
			</lc-info-card>

		</section>
	</main>

	<lc-footer></lc-footer>

	<script src="https://cc.cdn.civiccomputing.com/9/cookieControl-9.x.min.js"></script>
	<script type="module" src="./src/scripts/cookies.js"></script>
</body>

</html>
