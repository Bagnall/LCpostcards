<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>French, German and Spanish Intermediate Conversation Hours | Cambridge Language Centre</title>
	<meta name="description" content="Informal French, German and Spanish conversation groups for B1+ learners at the University of Cambridge Language Centre.">
	<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet"
		href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap">
	<script type="module" src="./src/scripts/main.js"></script>
</head>

<body class="flex min-h-screen flex-col theme-intermediate">

	<lc-header page-label="French, German and Spanish Intermediate Conversation Hours — site header"></lc-header>

	<main id="main-content" class="grow">
		<section class="mx-auto grid w-full max-w-6xl gap-8 px-4 py-8 md:py-12 lg:grid-cols-2 lg:items-stretch">

			<lc-hero-poster artwork-src="./assets/illustrations/fgs-speech-bubble.svg" artwork-alt=""></lc-hero-poster>

			<lc-info-card heading="French, German and Spanish Intermediate Conversation Hours" lede="Develop your language speaking skills.">
				<p>Informal group sessions, covering topics including culture, traditions, food and hobbies, supported by a language teacher.</p>
				<ul><li>Suitable for B1+ learners</li></ul>
				<lc-fees></lc-fees>
				<div class="flex flex-wrap items-center justify-between gap-4">
					<a class="inline-flex items-center gap-2 rounded-full bg-accent px-6 py-3 text-base/(--leading-body) font-bold !text-white !no-underline transition hover:bg-accent-strong hover:-translate-y-0.5" href="https://www.langcen.cam.ac.uk/advising/speaking-practice.html">Book your place online</a>
					<img src="./assets/illustrations/fgs-pencils.svg" alt="" aria-hidden="true"
						class="w-20 shrink-0 md:w-24">
				</div>
			</lc-info-card>

		</section>
	</main>

	<lc-footer></lc-footer>

	<script src="https://cc.cdn.civiccomputing.com/9/cookieControl-9.x.min.js"></script>
	<script type="module" src="./src/scripts/cookies.js"></script>
</body>

</html>
